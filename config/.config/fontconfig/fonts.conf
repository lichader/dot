<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>rgb</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <!-- Map fonts that are commonly used by web pages to our preferred fonts -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>Arial</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>sans-serif</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Liberation Sans</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>sans-serif</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Liberation Mono</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>monospace</string>
  </edit>
 </match>
 <!-- Redirect the previous defaults to the new Apple font stack. -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>Inter</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>sans-serif</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Noto Serif</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>serif</string>
  </edit>
 </match>
 <match target="pattern">
  <test name="family" qual="any">
   <string>Sarasa Term SC</string>
  </test>
  <edit binding="same" mode="assign" name="family">
   <string>monospace</string>
  </edit>
 </match>
 <!-- Default sans-serif font -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>sans-serif</string>
  </test>
  <edit binding="same" mode="prepend" name="family">
   <string>SF Pro Text</string>
  </edit>
 </match>
 <!-- Default serif fonts -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>serif</string>
  </test>
  <edit binding="same" mode="prepend" name="family">
   <string>New York</string>
  </edit>
 </match>
 <!-- Default monospace fonts -->
 <match target="pattern">
  <test name="family" qual="any">
   <string>monospace</string>
  </test>
  <edit binding="same" mode="prepend" name="family">
   <string>SF Mono</string>
  </edit>
 </match>
 <!-- Fallback fonts preference order -->
 <alias>
  <family>sans-serif</family>
  <prefer>
   <family>SF Pro Text</family>
   <family>PingFang SC</family>
   <family>PingFang TC</family>
   <family>PingFang HK</family>
   <family>PingFang MO</family>
   <family>Noto Sans CJK SC</family>
   <family>Noto Sans CJK TC</family>
   <family>Noto Sans CJK JP</family>
   <family>Noto Sans CJK KR</family>
   <family>Noto Color Emoji</family>
   <family>Noto Emoji</family>
  </prefer>
 </alias>
 <alias>
  <family>serif</family>
  <prefer>
   <family>New York</family>
   <family>Noto Serif CJK SC</family>
   <family>Noto Serif CJK TC</family>
   <family>Noto Serif CJK JP</family>
   <family>Noto Serif CJK KR</family>
   <family>Noto Color Emoji</family>
   <family>Noto Emoji</family>
  </prefer>
 </alias>
 <alias>
  <family>monospace</family>
  <prefer>
   <family>SF Mono</family>
   <family>Sarasa Term SC</family>
   <family>Sarasa Term TC</family>
   <family>Sarasa Term J</family>
   <family>Noto Color Emoji</family>
   <family>Noto Emoji</family>
  </prefer>
 </alias>
 <!-- Locale-specific Chinese fonts must be applied after generic aliases. -->
 <!-- Default Chinese font when content does not specify a regional variant -->
 <match target="pattern">
  <test compare="eq" name="lang">
   <string>zh</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>PingFang SC</string>
  </edit>
 </match>
 <!-- Simplified Chinese -->
 <match target="pattern">
  <test compare="eq" name="lang">
   <string>zh-cn</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>PingFang SC</string>
  </edit>
 </match>
 <match target="pattern">
  <test compare="eq" name="lang">
   <string>zh-sg</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>PingFang SC</string>
  </edit>
 </match>
 <!-- Traditional Chinese -->
 <match target="pattern">
  <test compare="eq" name="lang">
   <string>zh-tw</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>PingFang TC</string>
  </edit>
 </match>
 <match target="pattern">
  <test compare="eq" name="lang">
   <string>zh-hk</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>PingFang HK</string>
  </edit>
 </match>
 <match target="pattern">
  <test compare="eq" name="lang">
   <string>zh-mo</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>PingFang MO</string>
  </edit>
 </match>
 <!-- Keep CJK text monospaced in terminals and code-oriented applications. -->
 <match target="pattern">
  <test compare="contains" name="family">
   <string>monospace</string>
  </test>
  <test compare="eq" name="lang">
   <string>zh</string>
  </test>
  <edit binding="strong" mode="prepend_first" name="family">
   <string>Sarasa Mono SC</string>
  </edit>
 </match>
 <match target="pattern">
  <test compare="contains" name="family">
   <string>monospace</string>
  </test>
  <test compare="eq" name="lang">
   <string>zh-cn</string>
  </test>
  <edit binding="strong" mode="prepend_first" name="family">
   <string>Sarasa Mono SC</string>
  </edit>
 </match>
 <match target="pattern">
  <test compare="contains" name="family">
   <string>monospace</string>
  </test>
  <test compare="eq" name="lang">
   <string>zh-sg</string>
  </test>
  <edit binding="strong" mode="prepend_first" name="family">
   <string>Sarasa Mono SC</string>
  </edit>
 </match>
 <match target="pattern">
  <test compare="contains" name="family">
   <string>monospace</string>
  </test>
  <test compare="eq" name="lang">
   <string>zh-tw</string>
  </test>
  <edit binding="strong" mode="prepend_first" name="family">
   <string>Sarasa Mono TC</string>
  </edit>
 </match>
 <match target="pattern">
  <test compare="contains" name="family">
   <string>monospace</string>
  </test>
  <test compare="eq" name="lang">
   <string>zh-hk</string>
  </test>
  <edit binding="strong" mode="prepend_first" name="family">
   <string>Sarasa Mono TC</string>
  </edit>
 </match>
 <match target="pattern">
  <test compare="contains" name="family">
   <string>monospace</string>
  </test>
  <test compare="eq" name="lang">
   <string>zh-mo</string>
  </test>
  <edit binding="strong" mode="prepend_first" name="family">
   <string>Sarasa Mono TC</string>
  </edit>
 </match>
 <selectfont>
  <rejectfont>
   <pattern>
    <patelt name="family">
     <!-- This font is causing problem with GitHub -->
     <string>Nimbus Sans</string>
    </patelt>
   </pattern>
  </rejectfont>
 </selectfont>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <dir>~/.local/share/fonts</dir>
</fontconfig>
