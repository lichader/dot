# Use vim keybindings in copy mode
set -s set-clipboard external
setw -g mode-keys vi

# Enable mouse mode
set -g mouse on

set-option -g history-limit 100000

# Force window lists on the left
# In Mac, it's set to middle by default for some reasons
set -g status-justify left

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Change the resize size to 5
bind-key -r -T prefix       C-Up              resize-pane -U 5
bind-key -r -T prefix       C-Down            resize-pane -D 5
bind-key -r -T prefix       C-Left            resize-pane -L 5
bind-key -r -T prefix       C-Right           resize-pane -R 5

# Gruvbox theme (configure BEFORE loading plugins so modules render correctly)
set -g @tmux-gruvbox 'dark'
set -g @tmux-gruvbox-statusbar-alpha 'true'
# Keep my old session-name truncation (16 chars + ellipsis)
set -g @tmux-gruvbox-left-status-a '#{=/16/...:session_name}'
# Right status: prefix/mode badge first, then date + time in the accent pill.
# The first pill is hardwired as " x  y " (two slots) -- filling only one leaves
# a gap, so the badge uses both: an icon in x and the state word in y.
#   PREFIX when the prefix key is pressed, COPY in copy-mode, ZOOM when zoomed,
#   otherwise READY. Pure built-in -- no plugin, no shell-out.
set -g @tmux-gruvbox-right-status-x '#{?client_prefix,⌨,●}'
set -g @tmux-gruvbox-right-status-y '#{?client_prefix,PREFIX,#{?pane_in_mode,COPY,#{?window_zoomed_flag,ZOOM,READY}}}'
# Accent pill (z, formerly the hostname): date + time together.
set -g @tmux-gruvbox-right-status-z '%a %d %b  %I:%M %p'

# Install TPM + plugins under XDG_DATA_HOME, not ~/.config or ~/.tmux
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Neovim integration
set -g @plugin 'christoomey/vim-tmux-navigator'

# Copy using system clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

# Restore neovim sessions
set -g @resurrect-strategy-nvim 'session'

# Automatically save tmux sessions
set -g @continuum-restore 'on'

# change hot key to uninstall packages to fix iterm compatibility issue
# set -g @tpm-clean 'R'

# Dim inactive panes, active pane stays black
set -g window-style 'fg=colour245,bg=colour236'
set -g window-active-style 'fg=colour250,bg=colour232'


# Show pane index in border
set -g pane-border-status top
set -g pane-border-format ' #{pane_index} '

# Status bar styling is now handled by egel/tmux-gruvbox (see top of file)

# Auto renumber windows after one is closed
set-option -g renumber-windows on

# For pasting into system clipboard
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'

set -g default-command /bin/zsh

# Self-bootstrap TPM: clone it + install all plugins on first launch.
# Synchronous (no -b) on purpose -- blocks the config queue until the clone
# finishes, so the `run` line below is guaranteed to find tpm on first start.
if "test ! -d ~/.local/share/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm && ~/.local/share/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.local/share/tmux/plugins/tpm/tpm'
